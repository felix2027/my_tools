# ====================================================
# Clash 规则全量冷备配置（配合 git clone --depth 1 --sparse）
# 1. 全量镜像 viewer12 / blackmatrix7 / ACL4SSR 三大仓库的所有 Clash .list 规则
# 2. 通过 legacy_aliases 自动同步更新原扁平路径文件，100% 兼容现有所有 .ini 配置
# 3. 如需连同 .yaml 规则一并冷备，可将对应仓库的 file_extension: .list 改为 [.list, .yaml]
# ====================================================

files:
  - filename: GeneralClashConfig.yml
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
    download_location: ./config/Ruleset/ACL4SSR/

folders:
  # 1. viewer12 海外 AI 规则全量冷备
  - github_repo: viewer12/OverseasAI.list
    branch: main
    folder_path: rule/Clash
    file_extension: .list
    backup_location: ./config/Ruleset/viewer12/Clash/
    legacy_location: ./config/Ruleset/viewer12/
    legacy_aliases:
      - OverseasAI/OverseasAI.list

  # 2. blackmatrix7 所有 Clash 分流规则全量冷备（500+ 目录）
  # 全量树保存在 ./config/Ruleset/blackmatrix7/Clash/ 下；
  # 同时将现有配置引用的 24 个常用列表同步写回原扁平目录，确保历史链接零改动可用
  - github_repo: blackmatrix7/ios_rule_script
    branch: master
    folder_path: rule/Clash
    file_extension: .list
    backup_location: ./config/Ruleset/blackmatrix7/Clash/
    legacy_location: ./config/Ruleset/blackmatrix7/
    legacy_aliases:
      - Advertising/Advertising.list
      - AdvertisingLite/AdvertisingLite.list
      - Apple/Apple.list
      - Bahamut/Bahamut.list
      - BiliBili/BiliBili.list
      - China/China.list
      - ChinaMax/ChinaMax.list
      - Claude/Claude.list
      - Cloud/CloudCN/CloudCN.list
      - Copilot/Copilot.list
      - Direct/Direct.list
      - EasyPrivacy/EasyPrivacy.list
      - Game/Game.list
      - Gemini/Gemini.list
      - GoogleFCM/GoogleFCM.list
      - GovCN/GovCN.list
      - Hijacking/Hijacking.list
      - Lan/Lan.list
      - Microsoft/Microsoft.list
      - MicrosoftEdge/MicrosoftEdge.list
      - OneDrive/OneDrive.list
      - OpenAI/OpenAI.list
      - Privacy/Privacy.list
      - PrivateTracker/PrivateTracker.list

  # 3. ACL4SSR 根目录与 Ruleset 子目录全量冷备（同一仓库会自动合并为 1 次 git clone）
  - github_repo: ACL4SSR/ACL4SSR
    branch: master
    folder_path: Clash
    file_extension: .list
    backup_location: ./config/Ruleset/ACL4SSR/Clash/
    exclude_dirs: [Ruleset]
    legacy_location: ./config/Ruleset/ACL4SSR/
    legacy_aliases:
      - BanAD.list
      - BanEasyList.list
      - BanEasyListChina.list
      - BanEasyPrivacy.list
      - BanProgramAD.list
      - ChinaCompanyIp.list
      - ChinaDomain.list
      - ChinaIp.list
      - ChinaIpV6.list
      - ChinaMedia.list
