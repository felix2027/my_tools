      - ProxyLite.list
      - ProxyMedia.list
      - Telegram.list
      - UnBan.list
      - Xbox.list

  - github_repo: ACL4SSR/ACL4SSR
    branch: master
    folder_path: Clash/Ruleset
    file_extension: .list
    backup_location: ./config/Ruleset/ACL4SSR/Ruleset/
