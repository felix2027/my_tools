name: Download Files from Config

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0 点运行

permissions:
  contents: write

concurrency:
  group: rule-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install PyYAML requests

      - name: Download files based on config
        id: backup
        run: |
          status=0
          python download_script.py || status=$?
          case "$status" in
            0) ;;
            2) echo "partial=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_PATHS_FILE: ${{ runner.temp }}/backup-paths

      - name: Commit and Push if changed
        run: |
          if [[ ! -s "$RUNNER_TEMP/backup-paths" ]]; then
            echo "No completed downloads to publish."
            exit 0
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git --literal-pathspecs add --force --pathspec-from-file="$RUNNER_TEMP/backup-paths" --pathspec-file-nul
          if git diff --staged --quiet; then
            echo "No changes to commit, working tree clean."
          else
            git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      - name: Report incomplete backup
        if: steps.backup.outputs.partial == 'true'
        run: |
          echo "::error::Some upstream sources failed. See the download step for skipped sources."
          exit 1
