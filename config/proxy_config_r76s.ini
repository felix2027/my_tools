[custom]
; R76S 标准 Subconverter 模板。将本 INI 的地址作为 Clash 完整订阅的 config 参数。
; 地区自动选择节点，Fallback 优先台湾、新加坡、日本、美国、香港，最后使用其他地区。
; 上层组只探测各地区当前出口，每个节点只列入一个地区的自动测速组。
; WAN2 节点出口、WAN1 国内直连白名单、F50 月额度及掉线阻断由 OpenWrt 执行。

enable_rule_generator=true
overwrite_original_rules=true
; 保留原节点名中的国旗供地区匹配。仅在节点与策略同名时给节点加前缀。
add_emoji=false
remove_old_emoji=false
rename=^(Proxies|Manual|Auto|LoadBalance|Fallback|Direct|Ai|Apple|Bahamut|Bilibili|Game|Microsoft|AdBlock|Final|TW_HK_Fallback|TW|SG|JP|US|HK|Other|DIRECT|REJECT|REJECT-DROP|PASS|PASS-RULE|COMPATIBLE|GLOBAL|DNS)$@Node-$1

; 已知私网目标交系统路由，保留 LAN/VLAN 和远端专网的具体路由。
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve

; 沿用 next 的业务规则及优先级，OneDrive 仍由 Microsoft 组处理。
ruleset=Final,[]DOMAIN-SUFFIX,jsdelivr.net
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/AdvertisingLite.list
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Hijacking.list
ruleset=Ai,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OpenAI.list
ruleset=Ai,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Gemini.list
ruleset=Ai,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Claude.list
ruleset=Ai,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Copilot.list
ruleset=Apple,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Apple.list
ruleset=Bahamut,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Bahamut.list
ruleset=Bilibili,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/BiliBili.list
ruleset=Game,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Game.list
ruleset=Microsoft,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Microsoft.list
ruleset=Microsoft,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/MicrosoftEdge.list
ruleset=Microsoft,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OneDrive.list
ruleset=Proxies,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GoogleFCM.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Direct.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/China.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GovCN.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/PrivateTracker.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/CloudCN.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Lan.list
ruleset=Direct,[]GEOIP,CN,no-resolve
ruleset=Final,[]FINAL

; 业务组保留 next 的默认选择。首次选择 Manual 时也能自动容灾。
custom_proxy_group=Proxies`select`[]Fallback`[]LoadBalance`[]Manual`[]TW`[]SG`[]JP`[]US`[]HK`[]Auto`[]DIRECT
custom_proxy_group=Manual`select`[]Fallback`.*`[]REJECT
custom_proxy_group=Direct`select`[]DIRECT`[]Proxies`[]Auto
custom_proxy_group=Ai`select`[]Proxies`[]US`[]Manual`[]Auto`[]TW`[]HK`[]SG`[]JP`[]DIRECT
custom_proxy_group=Apple`select`[]Proxies`[]Manual`[]Auto`[]TW`[]HK`[]SG`[]JP`[]US`[]DIRECT
custom_proxy_group=Bahamut`select`[]TW_HK_Fallback`[]Proxies`[]DIRECT
custom_proxy_group=Bilibili`select`[]Direct`[]TW_HK_Fallback`[]Proxies
custom_proxy_group=Game`select`[]Proxies`[]Manual`[]Auto`[]TW`[]HK`[]SG`[]JP`[]US`[]DIRECT
custom_proxy_group=Microsoft`select`[]Proxies`[]Manual`[]Auto`[]TW`[]HK`[]SG`[]JP`[]US`[]DIRECT
custom_proxy_group=AdBlock`select`[]REJECT`[]Proxies`[]DIRECT
custom_proxy_group=Final`select`[]Proxies`[]Manual`[]DIRECT

; Fallback 每 150 秒检查六个地区出口，港台限定组只检查 TW 和 HK。
; Auto 比较各地区当前出口的延迟，LoadBalance 在可用的地区出口间分担连接。
custom_proxy_group=Fallback`fallback`[]TW`[]SG`[]JP`[]US`[]HK`[]Other`https://www.gstatic.com/generate_204`150
custom_proxy_group=TW_HK_Fallback`fallback`[]TW`[]HK`https://www.gstatic.com/generate_204`150
custom_proxy_group=Auto`url-test`[]TW`[]SG`[]JP`[]US`[]HK`[]Other`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=LoadBalance`load-balance`[]TW`[]SG`[]JP`[]US`[]HK`[]Other`https://www.gstatic.com/generate_204`600

; 地区组每 600 秒测速，150 毫秒容差减少频繁换节点。REJECT 在最后，地区为空时阻止直连。
; 多地区标签按上面的地区顺序归入首个匹配组。Other 覆盖无标签节点。
custom_proxy_group=TW`url-test`(?i)^.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z]))`[]REJECT`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=SG`url-test`(?i)^(?!.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z]))).*(?:🇸🇬|新加坡|[狮獅]城|(?<![a-z])(?:sg|sgp|singapore)(?![a-z]))`[]REJECT`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=JP`url-test`(?i)^(?!.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇸🇬|新加坡|[狮獅]城|(?<![a-z])(?:sg|sgp|singapore)(?![a-z]))).*(?:🇯🇵|日本|东京|東京|大阪|埼玉|川日|泉日|沪日|滬日|深日|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z]))`[]REJECT`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=US`url-test`(?i)^(?!.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇸🇬|新加坡|[狮獅]城|(?<![a-z])(?:sg|sgp|singapore)(?![a-z])|🇯🇵|日本|东京|東京|大阪|埼玉|川日|泉日|沪日|滬日|深日|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z]))).*(?:🇺🇸|美[国國东西東中]|波特[兰蘭]|[达達]拉斯|俄勒[冈岡]|[凤鳳]凰城|[费費]利蒙|硅谷|矽谷|拉斯[维維]加斯|洛杉[矶磯]|圣何塞|聖何塞|圣克拉拉|聖克拉拉|西雅[图圖]|芝加哥|(?<![a-z])(?:us|usa|united states)(?![a-z]))`[]REJECT`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=HK`url-test`(?i)^(?!.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇸🇬|新加坡|[狮獅]城|(?<![a-z])(?:sg|sgp|singapore)(?![a-z])|🇯🇵|日本|东京|東京|大阪|埼玉|川日|泉日|沪日|滬日|深日|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z])|🇺🇸|美[国國东西東中]|波特[兰蘭]|[达達]拉斯|俄勒[冈岡]|[凤鳳]凰城|[费費]利蒙|硅谷|矽谷|拉斯[维維]加斯|洛杉[矶磯]|圣何塞|聖何塞|圣克拉拉|聖克拉拉|西雅[图圖]|芝加哥|(?<![a-z])(?:us|usa|united states)(?![a-z]))).*(?:🇭🇰|香港|深港|[沪滬广廣]港|港[区區]|(?<![a-z])(?:hk|hkg|hong[ -]?kong)(?![a-z]))`[]REJECT`https://www.gstatic.com/generate_204`600,,150
custom_proxy_group=Other`url-test`(?i)^(?!.*(?:🇹🇼|[台臺][湾灣北中南]|新北|彰化|深台|深臺|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇸🇬|新加坡|[狮獅]城|(?<![a-z])(?:sg|sgp|singapore)(?![a-z])|🇯🇵|日本|东京|東京|大阪|埼玉|川日|泉日|沪日|滬日|深日|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z])|🇺🇸|美[国國东西東中]|波特[兰蘭]|[达達]拉斯|俄勒[冈岡]|[凤鳳]凰城|[费費]利蒙|硅谷|矽谷|拉斯[维維]加斯|洛杉[矶磯]|圣何塞|聖何塞|圣克拉拉|聖克拉拉|西雅[图圖]|芝加哥|(?<![a-z])(?:us|usa|united states)(?![a-z])|🇭🇰|香港|深港|[沪滬广廣]港|港[区區]|(?<![a-z])(?:hk|hkg|hong[ -]?kong)(?![a-z]))).*$`[]REJECT`https://www.gstatic.com/generate_204`600,,150
