# ================== 5. 分流规则（与 proxy_config_next.ini 顺序完全一致） ==================
rules:
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - RULE-SET,Lan,DIRECT
  - RULE-SET,PrivateTracker,DIRECT
  - DOMAIN-SUFFIX,jsdelivr.net,Proxies
  - RULE-SET,AdvertisingLite,AdBlock
  - RULE-SET,Hijacking,AdBlock
  - RULE-SET,GoogleDeepMind,Ai
  - RULE-SET,OverseasAI,Ai
  - RULE-SET,Bahamut,Bahamut
  - RULE-SET,Bilibili,Bilibili
  - RULE-SET,SteamCN,DIRECT
  - RULE-SET,GameDownload,DIRECT
  - RULE-SET,GameDownloadCN,DIRECT
  - RULE-SET,Game,Game
  - RULE-SET,OneDrive,OneDrive
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Apple,Apple
  - RULE-SET,GoogleFCM,Google
  - RULE-SET,Telegram,Telegram
  - RULE-SET,ProxyMedia,Media
  - RULE-SET,Google,Google
  - RULE-SET,ProxyGFWlist,Proxies
  - RULE-SET,Direct,DIRECT
  - RULE-SET,GovCN,DIRECT
  - RULE-SET,CloudCN,DIRECT
  - RULE-SET,ChinaMax,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Final
