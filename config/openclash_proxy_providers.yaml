mode: rule
allow-lan: true
log-level: info

hosts:
  node1.example.com: target1.example.com
  node2.example.com: target2.example.com

# ================== 固定节点 ==================
proxies:
  - name: "自定义节点1"
    server: 
    port: 
    type: 
    password: 
    sni: 
    skip-cert-verify: true
    udp: true

  - name: "自定义节点2"
    server: 
    port: 
    type: 
    password: 
    sni: 
    skip-cert-verify: true
    udp: true

# ================== 机场代理集合（自动/手动热更新，不重启） ==================
proxy-providers:
  sub1:
    type: http
    url: " "
    path: ./proxy_providers/sub1.yaml
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - "clash-verge/v1.7.7"
    exclude-filter: "(?i)剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
      additional-prefix: "[sub1] "

  sub2:
    type: http
    url: " "
    path: ./proxy_providers/sub2.yaml
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - "clash-verge/v1.7.7"
    exclude-filter: "(?i)剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
      additional-prefix: "[sub2] "

  sub3:
    type: http
    url: "    "
    path: ./proxy_providers/sub3.yaml
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - "clash-verge/v1.7.7"
    exclude-filter: "(?i)剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
      additional-prefix: "[sub3] "

# ================== 策略组 ==================
proxy-groups:
  - name: Proxies
    type: select
    proxies:
      - Auto
      - HK
      - TW
      - SG
      - JP
      - US
      - Fallback
      - Manual
      - DIRECT

  - name: Manual
    type: select
    use:
      - sub1
      - sub2
      - sub3

  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    use:
      - sub1
      - sub2
      - sub3

  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
      - TW
      - SG
      - JP
      - US
      - HK

  - name: Ai
    type: select
    proxies:
      - AI_Auto
      - "自定义节点1"
      - "自定义节点2"
      - US
      - SG
      - JP
      - TW
      - Manual
      - Proxies

  - name: Google
    type: select
    proxies:
      - Ai
      - Proxies
      - Manual

  - name: AI_Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    exclude-filter: "(?i)港|(?<![a-z])(?:hk|hkg|hong[ _-]*kong)(?![a-z])|🇭🇰"
    filter: "(?i)新加坡|狮城|獅城|坡县|日本|川日|东京|東京|大阪|泉日|埼玉|沪日|深日|京都|名古屋|台|臺|新北|彰化|高雄|美|波特兰|达拉斯|達拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|洛杉磯|圣何塞|圣克拉拉|西雅图|西雅圖|芝加哥|纽约|紐約|(?<![a-z])(?:sg|sgp|singapore|jp|jpn|japan|tokyo|osaka|tw|twn|taiwan|taipei|us|usa|united[ _-]*states|america)(?![a-z])|🇸🇬|🇯🇵|🇹🇼|🇺🇸"
    use:
      - sub1
      - sub2
      - sub3

  - name: Media
    type: select
    proxies:
      - Proxies
      - SG
      - TW
      - JP
      - HK
      - US
      - Manual

  - name: Telegram
    type: select
    proxies:
      - Proxies
      - SG
      - HK
      - JP
      - US
      - Manual

  - name: Bahamut
    type: select
    proxies:
      - TW
      - HK
      - Proxies
      - Manual

  - name: Bilibili
    type: select
    proxies:
      - DIRECT
      - TW
      - HK
      - Manual
      - Proxies

  - name: Game
    type: select
    proxies:
      - Proxies
      - HK
      - TW
      - JP
      - SG
      - US
      - Manual
      - DIRECT

  - name: OneDrive
    type: select
    proxies:
      - Proxies
      - DIRECT
      - SG
      - HK
      - US
      - Manual

  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - Proxies
      - HK
      - SG
      - US
      - Manual

  - name: Apple
    type: select
    proxies:
      - DIRECT
      - Proxies
      - US
      - JP
      - TW
      - HK
      - Manual

  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: Final
    type: select
    proxies:
      - Proxies
      - DIRECT
      - Manual

  - name: HK
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    filter: "(?i)港|(?<![a-z])(?:hk|hkg|hong[ _-]*kong)(?![a-z])|🇭🇰"
    use:
      - sub1
      - sub2
      - sub3

  - name: TW
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    filter: "(?i)台|臺|新北|彰化|高雄|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇹🇼"
    use:
      - sub1
      - sub2
      - sub3

  - name: SG
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    filter: "(?i)新加坡|狮城|獅城|坡县|(?<![a-z])(?:sg|sgp|singapore)(?![a-z])|🇸🇬"
    use:
      - sub1
      - sub2
      - sub3

  - name: JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    filter: "(?i)日本|川日|东京|東京|大阪|泉日|埼玉|沪日|深日|京都|名古屋|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z])|🇯🇵"
    use:
      - sub1
      - sub2
      - sub3

  - name: US
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    filter: "(?i)美|波特兰|达拉斯|達拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|洛杉磯|圣何塞|圣克拉拉|西雅图|西雅圖|芝加哥|纽约|紐約|(?<![a-z])(?:us|usa|united[ _-]*states|america)(?![a-z])|🇺🇸"
    use:
      - sub1
      - sub2
      - sub3

