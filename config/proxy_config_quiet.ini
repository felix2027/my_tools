custom_proxy_group=Other`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)|(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰))).*$`[]REJECT


; ---------------------- 业务选择组 -----------------------
; 默认值由第一项决定，但客户端保存的选择可能覆盖默认值。
; 手选某个实体节点后，该业务不会再自动切换，恢复自动请选 Main。

; AI、Microsoft、Edge、OneDrive。
custom_proxy_group=AI`select`[]Main`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT`.*

custom_proxy_group=Apple`select`[]Main`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT`.*

; 如明确需要台湾出口，可直接选 TW；此时不自动切换到香港。
custom_proxy_group=Bahamut`select`[]TW_HK_Fallback`[]Main`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT`.*

custom_proxy_group=Bilibili`select`[]DIRECT`[]TW_HK_Fallback`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Main`[]REJECT`.*

custom_proxy_group=Game`select`[]Main`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT`.*

custom_proxy_group=Final`select`[]Main`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT`.*

; 广告默认拒绝。
custom_proxy_group=AdBlock`select`[]REJECT`[]Main`[]DIRECT

; 国内/直连规则默认直连，可统一改为 Main 或 REJECT。
custom_proxy_group=Direct`select`[]DIRECT`[]Main`[]REJECT


; ---------------------- 转换器设置 -----------------------

enable_rule_generator=true
overwrite_original_rules=true
icon=true