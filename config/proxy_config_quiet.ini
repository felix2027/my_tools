[custom]

; 配套基础模板：使用前先将 YAML 上传至此地址。
clash_rule_base=https://raw.githubusercontent.com/felix2027/my_tools/main/config/mihomo_base.yaml

; ============================================================
; 少量候选自动回退版
;
; 主回退顺序：
; Manual -> 新加坡 -> 澳门 -> 日本 -> 美国 -> 共享港台池 -> 其余
;
; 每个地区是 select，自动检查只经过该地区当前选择的一条节点。
; 地区内部换备用需要手动；跨地区自动回退。
; 全部节点仍保留在 Manual 和对应地区选择组中。
;
; 三个 fallback 均为 900 秒。
; 不要对 Manual、地区选择组、业务选择组开启全组自动测速。
; 不要把 fallback 间隔改成 0。
;
; Main 自动回退路径不含 DIRECT。
; B站/巴哈姆特的 TW_HK_Fallback 单独保留 DIRECT 兜底。
;
; 地区组默认第一个匹配节点；无匹配节点时只剩 REJECT。
; 地区仅通过节点名称识别，不能保证实际出口地区。
; 多标签按 SG -> MO -> JP -> US -> TW -> HK 互斥归属。
;
; 每条 custom_proxy_group 必须保持为一整行。
; ============================================================


; ======================== 分流规则 ========================

; 局域网和本地域名优先。
; 路由直连不等于局域网 DNS 已能正确解析。
ruleset=Direct,[]DOMAIN-SUFFIX,localhost
ruleset=Direct,[]DOMAIN-SUFFIX,local
ruleset=Direct,[]DOMAIN-SUFFIX,lan
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Lan.list

; jsDelivr
ruleset=Main,[]DOMAIN-SUFFIX,jsdelivr.net

; 广告和劫持：默认拒绝，可选 Main 或直连。
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/AdvertisingLite.list
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Hijacking.list

; B站、巴哈姆特独立控制，放在国内通用规则之前。
ruleset=Bilibili,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/BiliBili.list
ruleset=Bahamut,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Bahamut.list

; AI
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Gemini.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Claude.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Copilot.list

; YouTube 跟随 Main。
ruleset=Main,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list

; Apple、游戏独立控制。
ruleset=Apple,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Apple.list
ruleset=Game,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Game.list

; Microsoft、Edge、OneDrive 并入 AI。
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Microsoft.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/MicrosoftEdge.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OneDrive.list

ruleset=Main,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GoogleFCM.list

; 国内和其他直连规则统一交给 Direct 选择组。
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Direct.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/China.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GovCN.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/PrivateTracker.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/CloudCN.list
ruleset=Direct,[]GEOIP,CN,no-resolve

; 未匹配流量。
ruleset=Final,[]FINAL


; =================== 总入口与手动备用 ====================

; 默认自动回退；也可以固定 Manual、直连或拒绝。
custom_proxy_group=Main`select`[]Fallback`[]Manual`[]DIRECT`[]REJECT

; 第一项拒绝，后面保留全部实体节点。
; Main 直接选择 Manual 时，不再自动切换。
custom_proxy_group=Manual`select`[]REJECT`.*


; ===================== 三个自动组 =======================

; Manual 优先，然后按指定地区顺序回退。
custom_proxy_group=Fallback`fallback`[]Manual`[]SG_Select`[]MO_Select`[]JP_Select`[]US_Select`[]TW_HK_Proxy`[]Other_Select`https://www.gstatic.com/generate_204`900

; 纯代理港台池，供主 Fallback 复用。
; 不包含 DIRECT，避免 Main 自动落到直连。
custom_proxy_group=TW_HK_Proxy`fallback`[]TW_Select`[]HK_Select`[]REJECT`https://www.gstatic.com/generate_204`900

; 媒体兜底：港台当前出口不可用时尝试直连。
; 不保证巴哈姆特内容能够直连，也不逐个检测媒体解锁。
custom_proxy_group=TW_HK_Fallback`fallback`[]TW_HK_Proxy`[]DIRECT`https://www.bilibili.com`900


; ==================== 七个地区候选组 =====================
; 各地区默认第一个匹配节点，可以手动换选。
; 将某地区选为 REJECT，可停用该地区候选。
; 这些组没有自身定时测速，不会自动扫描地区内全部节点。

; 新加坡
custom_proxy_group=SG_Select`select`(?i)(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)`[]REJECT

; 澳门，排除已归入新加坡的节点。
custom_proxy_group=MO_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)))(?=.*(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)).*$`[]REJECT

; 日本，排除前面的地区。
custom_proxy_group=JP_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)))(?=.*(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)).*$`[]REJECT

; 美国，排除前面的地区。
custom_proxy_group=US_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)))(?=.*(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)).*$`[]REJECT

; 台湾，排除前面的地区。
custom_proxy_group=TW_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)))(?=.*(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)).*$`[]REJECT

; 香港，排除前面的地区，包括台湾。
custom_proxy_group=HK_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)))(?=.*(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰)).*$`[]REJECT

; 其余地区，排除上面六类。
custom_proxy_group=Other_Select`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)|(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰))).*$`[]REJECT


; ====================== 业务选择组 =======================
; 默认值由第一项决定，客户端保存的旧选择可能覆盖默认值。
; 直接选择实体节点后，该业务不会自动切换。

; AI 与 Microsoft
custom_proxy_group=AI`select`[]Main`[]DIRECT`[]REJECT`.*

; Apple
custom_proxy_group=Apple`select`[]Main`[]DIRECT`[]REJECT`.*

; 巴哈姆特
; 如明确需要台湾出口，可直接选 TW_Select。
custom_proxy_group=Bahamut`select`[]TW_HK_Fallback`[]TW_Select`[]Main`[]DIRECT`[]REJECT`.*

; B站默认直连，需要港台出口时选择 TW_HK_Fallback。
custom_proxy_group=Bilibili`select`[]DIRECT`[]TW_HK_Fallback`[]Main`[]REJECT`.*

; 游戏
custom_proxy_group=Game`select`[]Main`[]DIRECT`[]REJECT`.*

; 最终未匹配流量
custom_proxy_group=Final`select`[]Main`[]DIRECT`[]REJECT`.*

; 广告控制
custom_proxy_group=AdBlock`select`[]REJECT`[]Main`[]DIRECT

; 直连规则控制
; Direct 选择组与内置 DIRECT 不同。
custom_proxy_group=Direct`select`[]DIRECT`[]Main`[]REJECT


; ====================== 转换器设置 =======================

enable_rule_generator=true
overwrite_original_rules=true
icon=true