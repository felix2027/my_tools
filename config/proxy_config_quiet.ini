[custom]

; 配套基础模板：使用前先将 YAML 上传至此地址。
clash_rule_base=https://raw.githubusercontent.com/felix2027/my_tools/main/config/mihomo_base.yaml

; ============================================================
; 全量节点自动回退 + 地区手动选择
; 仓库位置：config/proxy_config_quiet.ini
; 配套模板：config/mihomo_base.yaml
;
; 主自动回退路径覆盖全部实体节点：
; Manual -> 新加坡全部 -> 澳门全部 -> 日本全部 -> 美国全部
; -> TW_HK_Proxy(台湾全部 -> 香港全部) -> 其余全部。
; 港台通过共享的纯代理子组覆盖，不在主组中再次重复列入实体。
; TW_HK_Fallback = TW_HK_Proxy -> DIRECT，仅供媒体兜底。
; 主自动回退路径不含 DIRECT，Main 仍可主动选择 DIRECT。
;
; 七个地区组保留为 select，仅用于手动挑选节点。
; Main / Manual 都可选择七个地区组；Manual 首项仍为 REJECT。
; Main -> 地区组：固定该地区当前手选出口，不自动换同区节点。
; Main -> Fallback 且 Manual -> 地区组：该手选出口优先，失败后继续全量回退。
;
; 地区 select 没有自身定时健康检查，也不会因选择操作自行扫描全组。
; 同一批实体仍在 Fallback / TW_HK_Proxy 中接受自动检查。
; Manual 作为 Fallback 首项时，父检查还会经过 Manual 当前出口一次。
; 因此“地区组不自行测速”不代表这些节点完全不会被其他组测试。
; 客户端/面板的自动测速是独立功能，应按需关闭。
;
; 三个 fallback 都保持 900 秒；恢复全量候选后，检查量随节点数量增加。
; 不再使用上一版“最多七条地区候选”的限制。
; 修改 Manual 选择后，父组健康状态可能要等下一轮检查才刷新。
; 不要把 fallback 间隔设为 0，当前内核可能将其补成 300 秒。
;
; 多标签按 SG -> MO -> JP -> US -> TW -> HK 互斥归属，地区由节点名称识别。
; 地区组默认第一匹配节点，不保证可用；没有匹配时只剩 REJECT。
; 地区组选择 REJECT 仅影响使用该手动组的路径，不会从自动池剔除该地区。
;
; Bilibili 默认 DIRECT；Bahamut 默认 TW_HK_Fallback。
; 媒体组检查共享港台池当前出口，不逐个检查媒体解锁。
; DIRECT 是媒体组最后候选；所有候选均失败时并非无条件直连。
;
; Direct 是规则选择组，与内置 DIRECT、DNS #DIRECT 不同。
; 把 Direct 选为 REJECT，不会阻止其他显式 DIRECT 路径。
; 配套 YAML 继续管理 DNS 和选择记忆；TUN/系统 DNS 接管由客户端管理。
; 转换链接建议 sort=false、scv=false、new_name=true；append_info 按需。
; 每条 custom_proxy_group 必须保持单行。
; ============================================================


; ------------------------ 分流规则 ------------------------

; 局域网和本地域名优先。路由直连不等于局域网 DNS 已能正确解析。
ruleset=Direct,[]DOMAIN-SUFFIX,localhost
ruleset=Direct,[]DOMAIN-SUFFIX,local
ruleset=Direct,[]DOMAIN-SUFFIX,lan
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Lan.list

; jsDelivr 跟随 Main。
ruleset=Main,[]DOMAIN-SUFFIX,jsdelivr.net

; 广告/劫持由 AdBlock 控制：默认拒绝，也可 Main 或 DIRECT。
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/AdvertisingLite.list
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Hijacking.list

; B站、巴哈姆特独立控制；放在国内通用规则之前。
ruleset=Bilibili,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/BiliBili.list
ruleset=Bahamut,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Bahamut.list

; AI 与 Microsoft 共用 AI 分组。
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Gemini.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Claude.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Copilot.list

; YouTube 跟随 Main；Apple/Game 独立；Microsoft/Edge/OneDrive 并入 AI。
ruleset=Main,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=Apple,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Apple.list
ruleset=Game,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Game.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Microsoft.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/MicrosoftEdge.list
ruleset=AI,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OneDrive.list
ruleset=Main,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GoogleFCM.list

; 国内和其他直连规则交给 Direct 选择组。
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Direct.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/China.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GovCN.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/PrivateTracker.list
ruleset=Direct,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/CloudCN.list
ruleset=Direct,[]GEOIP,CN,no-resolve

; 其余流量交给 Final。
ruleset=Final,[]FINAL


; -------------------- 总入口与手动备用 --------------------

; 默认全量自动回退，也可直接选择 Manual 或某个地区手动组。
custom_proxy_group=Main`select`[]Fallback`[]Manual`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`[]DIRECT`[]REJECT

; 首项 REJECT；七个地区组后继续保留全部实体节点。
; 不引用 Main/Fallback，避免形成循环。
custom_proxy_group=Manual`select`[]REJECT`[]Singapore`[]Macau`[]Japan`[]US`[]TW`[]HK`[]Other`.*


; ---------------------- 三个自动组 -----------------------

; 主组直接列入前四地区及其余实体；港台全部实体由共享子组覆盖。
custom_proxy_group=Fallback`fallback`[]Manual`(?i)(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)))(?=.*(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)).*$`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)))(?=.*(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)).*$`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)))(?=.*(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)).*$`[]TW_HK_Proxy`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)|(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰))).*$`https://www.gstatic.com/generate_204`900

; 全量台湾节点在前，全量香港节点在后；REJECT 防止空池被补 DIRECT。
custom_proxy_group=TW_HK_Proxy`fallback`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)))(?=.*(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)).*$`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)))(?=.*(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰)).*$`[]REJECT`https://www.gstatic.com/generate_204`900

; 媒体组末项为内置 DIRECT。
custom_proxy_group=TW_HK_Fallback`fallback`[]TW_HK_Proxy`[]DIRECT`https://www.bilibili.com`900


; -------------------- 七个地区手动组 ---------------------
; 不设置 url / interval，不配置自身定时测速。
; Main / Manual 均可引用；手选后不自动寻找同区的其他节点。
; 将某地区手动组设为 REJECT，不会停用自动池里的同地区实体。

; 新加坡手动选择：默认第一个匹配节点；无匹配时只有 REJECT。
custom_proxy_group=Singapore`select`(?i)(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)`[]REJECT

; 澳门手动选择：默认第一个匹配节点；无匹配时只有 REJECT。
custom_proxy_group=Macau`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)))(?=.*(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)).*$`[]REJECT

; 日本手动选择：默认第一个匹配节点；无匹配时只有 REJECT。
custom_proxy_group=Japan`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)))(?=.*(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)).*$`[]REJECT

