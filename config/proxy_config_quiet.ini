custom_proxy_group=HK`select`(?i)^(?!.*(?:(新加坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬)|(澳门|澳門|macau|macao|(?:^|[^a-z])mo(?:[^a-z]|$)|🇲🇴)|(日本|东京|東京|大阪|埼玉|京都|沪日|深日|川日|泉日|japan|tokyo|osaka|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵)|(美国|美國|洛杉矶|洛杉磯|硅谷|西雅图|西雅圖|纽约|紐約|芝加哥|达拉斯|達拉斯|波特兰|俄勒冈|凤凰城|费利蒙|拉斯维加斯|圣何塞|圣克拉拉|united[ _-]*states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$)|🇺🇸)|(台湾|台灣|臺灣|台北|臺北|台中|臺中|台南|臺南|新北|彰化|高雄|taiwan|taipei|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼)))(?=.*(香港|hong[ _-]*kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰)).*$`[]REJECT

