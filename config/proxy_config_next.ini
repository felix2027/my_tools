; --------------------- [Custom Proxy Groups] ---------------------
custom_proxy_group=Proxies`select`[]Auto`[]HK`[]TW`[]SG`[]JP`[]US`[]Fallback`[]Manual`[]DIRECT
custom_proxy_group=Manual`select`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址)).*$
custom_proxy_group=Auto`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址)).*$`http://www.gstatic.com/generate_204`600,,150
custom_proxy_group=Fallback`fallback`[]TW`[]SG`[]JP`[]US`[]HK`http://www.gstatic.com/generate_204`180


