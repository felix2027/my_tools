[custom]
; ====================================================
; Clash / Mihomo (Subconverter) 终极精调版自定义配置文件
; 说明：所有远程规则集均已对齐并验证存在于 felix2027/my_tools 仓库中
; ====================================================

; --------------------- [Rulesets] ---------------------
; 1. 第一梯队：局域网、异地组网(Tailscale)、PT 站与直连白名单（直接绑定内置不可变 DIRECT，杜绝面板误触导致内网失联或 PT 封号）
ruleset=DIRECT,[]DOMAIN-SUFFIX,ts.net
ruleset=DIRECT,[]DOMAIN-SUFFIX,tailscale.com
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Lan.list
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/PrivateTracker.list
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Direct.list

; 2. 特殊修正：优先让 jsDelivr 走代理，避免直连 DNS 污染或连接超时
ruleset=Proxies,[]DOMAIN-SUFFIX,jsdelivr.net

; 3. 广告与运营商劫持拦截（软路由整网环境建议保持 Lite，勿开 Privacy 以免误杀小程序/电商返利）
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/AdvertisingLite.list
ruleset=AdBlock,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Hijacking.list

; 4. 海外 AI 分流（必须在 Microsoft / Google / Apple 之前命中，确保 Copilot / Gemini 等走非港节点）
ruleset=Ai,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/viewer12/OverseasAI.list

; 5. 港台番剧与流媒体细分
ruleset=Bahamut,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Bahamut.list
ruleset=Bilibili,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/BiliBili.list

; 6. 游戏分流：先放行国内游戏下载 CDN 直连跑满千兆宽带，再将商店/社区/外服联机送入 Game 组
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/SteamCN.list
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/GameDownload.list
; 跑完一次全量冷备 Action 后，也可启用下面这条更细的 blackmatrix7 国内游戏下载 CDN 规则：
;ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Clash/Game/GameDownloadCN/GameDownloadCN.list
ruleset=Game,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Game.list

; 7. 微软与苹果：拆分 OneDrive 走代理，其余微软（含 Windows Update）与苹果基础服务默认直连省流量
ruleset=OneDrive,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/OneDrive.list
ruleset=Microsoft,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Microsoft.list
ruleset=Apple,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/Apple.list

; 8. 海外核心服务、流媒体与全球代理（独立拆出 Media 组便于单独切解锁地区，同时避免被墙流量穿透国内规则引发 DNS 抢答）
ruleset=Proxies,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GoogleFCM.list
ruleset=Telegram,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/Telegram.list
ruleset=Media,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/Clash/ProxyMedia.list
ruleset=Proxies,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/Clash/ProxyGFWlist.list

; 9. 国内全量直连（R76S 4G 内存直接启用 ChinaMax，减少国内冷门网银/政企/小程序误入代理）
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/GovCN.list
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/CloudCN.list
ruleset=DIRECT,https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/blackmatrix7/ChinaMax.list
ruleset=DIRECT,[]GEOIP,CN,no-resolve

; 10. 兜底规则
ruleset=Final,[]FINAL


; --------------------- [Custom Proxy Groups] ---------------------
custom_proxy_group=Proxies`select`[]Auto`[]HK`[]TW`[]SG`[]JP`[]US`[]Fallback`[]Manual`[]DIRECT
custom_proxy_group=Manual`select`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址)).*$
custom_proxy_group=Auto`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*$`http://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=Fallback`fallback`[]TW`[]SG`[]JP`[]US`[]HK`http://www.gstatic.com/generate_204`180,5


; --------------------- [Application Specific Proxy Groups] ---------------------
; AI 专属组：默认走排除香港后的 AI_Auto，彻底规避 ChatGPT / Claude / Gemini 封禁香港 IP 问题
custom_proxy_group=Ai`select`[]AI_Auto`[]US`[]SG`[]JP`[]TW`[]Manual`[]Proxies
custom_proxy_group=AI_Auto`fallback`[]SG`[]JP`[]TW`[]US`http://www.gstatic.com/generate_204`180,5

; 海外流媒体组（YouTube / Netflix / TikTok / Disney+ 等，主代理用香港受限时可单独切 SG/TW/JP/US）
custom_proxy_group=Media`select`[]Proxies`[]SG`[]TW`[]JP`[]HK`[]US`[]Manual

; 细分应用组（全面统一使用内置 []DIRECT，移除多余的 Direct 包装组）
custom_proxy_group=Telegram`select`[]Proxies`[]SG`[]HK`[]JP`[]US`[]Manual
custom_proxy_group=Bahamut`select`[]TW`[]HK`[]Proxies`[]Manual
custom_proxy_group=Bilibili`select`[]DIRECT`[]TW`[]HK`[]Manual`[]Proxies
custom_proxy_group=Game`select`[]Proxies`[]HK`[]TW`[]JP`[]SG`[]US`[]Manual`[]DIRECT
custom_proxy_group=OneDrive`select`[]Proxies`[]DIRECT`[]SG`[]HK`[]US`[]Manual
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxies`[]HK`[]SG`[]US`[]Manual
custom_proxy_group=Apple`select`[]DIRECT`[]Proxies`[]US`[]JP`[]TW`[]HK`[]Manual

custom_proxy_group=AdBlock`select`[]REJECT`[]DIRECT
custom_proxy_group=Final`select`[]Proxies`[]DIRECT`[]Manual


; --------------------- [Node Test Groups] ---------------------
; 区域自动测速：补齐大小写/国旗 Emoji/英文单词边界，修复“吉隆坡->SG”、“NETWORK->TW”、“AUS/RUS->US”三大串组问题
custom_proxy_group=HK`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*(?:港|(?<![a-z])(?:hk|hkg|hong[ _-]*kong)(?![a-z])|🇭🇰).*$`http://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=TW`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*(?:台|臺|新北|彰化|高雄|(?<![a-z])(?:tw|twn|taiwan|taipei)(?![a-z])|🇹🇼).*$`http://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=SG`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*(?:新加坡|狮城|獅城|坡县|(?<![a-z])(?:sg|sgp|singapore)(?![a-z])|🇸🇬).*$`http://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=JP`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*(?:日本|川日|东京|東京|大阪|泉日|埼玉|沪日|深日|京都|名古屋|(?<![a-z])(?:jp|jpn|japan|tokyo|osaka)(?![a-z])|🇯🇵).*$`http://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=US`url-test`(?i)^(?!.*(?:剩余|流量|到期|官网|套餐|重置|群|失联|频道|网址|(?<![0-9.])(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)\s*(?:[x×](?![a-z0-9])|倍)|(?:(?<![a-z0-9])[x×]|倍率?\s*[:：]?)\s*(?:1\.\d*[1-9]\d*|(?:[2-9]|[1-9]\d+)(?:\.\d+)?)(?![0-9.]))).*(?:美|波特兰|达拉斯|達拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|洛杉磯|圣何塞|圣克拉拉|西雅图|西雅圖|芝加哥|纽约|紐約|(?<![a-z])(?:us|usa|united[ _-]*states|america)(?![a-z])|🇺🇸).*$`http://www.gstatic.com/generate_204`600,5,50


; --------------------- [Settings] ---------------------
enable_rule_generator=true
overwrite_original_rules=true

; 软路由 OpenClash / Nikki 建议保持注释，由插件自身接管端口、TUN/TProxy 与防泄露 DNS：
;clash_rule_base=https://raw.githubusercontent.com/felix2027/my_tools/main/config/Ruleset/ACL4SSR/GeneralClashConfig.yml
